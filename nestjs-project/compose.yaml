services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Same image and code as the API, in its own process (TD-05). Unlike
  # nestjs-api, it starts by itself and restarts by itself; no published port.
  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "start:worker:dev"]
    volumes:
      - .:/home/node/app
    restart: unless-stopped
    # SIGTERM lets the active job (probe + thumbnail) finish before the stop.
    stop_grace_period: 2m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:8
    # BullMQ breaks if Redis evicts keys; AOF persists the queue across restarts.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-streamtube}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-streamtube-secret}
      - MINIO_API_STALE_UPLOADS_EXPIRY=24h
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

  # One-shot: creates the dev and test buckets, then exits.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-streamtube}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-streamtube-secret}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing local/streamtube local/streamtube-test"]

volumes:
  redis-data:
  minio-data:
